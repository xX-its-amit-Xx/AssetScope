# AssetScope — one-command local stack: API + Postgres/pgvector + frontend.
#   docker compose up --build
# Then open http://localhost:8080 (UI) and http://localhost:8000/docs (API).
# Set ANTHROPIC_API_KEY in your shell or a .env file for the live agent.

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: assetscope
      POSTGRES_PASSWORD: assetscope
      POSTGRES_DB: assetscope
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Auto-applies the pgvector schema on first initialization.
      - ./assetscope/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assetscope -d assetscope"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
      args:
        # Flip to "true" to bake in sentence-transformers (real semantic
        # embeddings, ~2GB image). Default uses the torch-free hashing embedder.
        INSTALL_EMBEDDINGS: "false"
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ASSETSCOPE_ANTHROPIC_MODEL: ${ASSETSCOPE_ANTHROPIC_MODEL:-claude-sonnet-4-6}
      # LLM backend: "anthropic" (default) or "local"/"openai". For a local model,
      # run llama-server/Ollama on the host and point the base URL at it.
      ASSETSCOPE_LLM_BACKEND: ${ASSETSCOPE_LLM_BACKEND:-anthropic}
      ASSETSCOPE_LLM_BASE_URL: ${ASSETSCOPE_LLM_BASE_URL:-}
      ASSETSCOPE_LLM_MODEL: ${ASSETSCOPE_LLM_MODEL:-local}
      ASSETSCOPE_LLM_MAX_TOKENS: ${ASSETSCOPE_LLM_MAX_TOKENS:-1200}
      ASSETSCOPE_MAX_TOOL_CALLS: ${ASSETSCOPE_MAX_TOOL_CALLS:-12}
      ASSETSCOPE_DATABASE_URL: postgresql://assetscope:assetscope@db:5432/assetscope
      ASSETSCOPE_USE_FAKE_EMBEDDINGS: ${ASSETSCOPE_USE_FAKE_EMBEDDINGS:-1}
      ASSETSCOPE_CORS_ORIGINS: http://localhost:5173,http://localhost:4173,http://localhost:8080
      ASSETSCOPE_CONTACT_EMAIL: ${ASSETSCOPE_CONTACT_EMAIL:-assetscope@example.com}
      ASSETSCOPE_PUBMED_API_KEY: ${ASSETSCOPE_PUBMED_API_KEY:-}
    # Lets the container reach a model server running on the host as
    # http://host.docker.internal:8081/v1 (set ASSETSCOPE_LLM_BASE_URL to that).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: http://localhost:8000
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  pgdata:
