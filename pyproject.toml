[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "assetscope"
version = "0.1.0"
description = "An open-source agentic competitive-intelligence engine for biopharma."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "AssetScope contributors" }]
keywords = ["biopharma", "competitive-intelligence", "agent", "rag", "pgvector", "anthropic"]
classifiers = [
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Programming Language :: Python :: 3.11",
  "Intended Audience :: Science/Research",
]

dependencies = [
  "anthropic>=0.40",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "sse-starlette>=2.1",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-dotenv>=1.0",
  "tenacity>=8.4",
  "numpy>=1.26",
  # Retrieval / DB
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",
  "rank-bm25>=0.2.2",          # in-memory BM25 fallback when Postgres is unavailable
  # MCP server entrypoint
  "mcp>=1.2",
]

[project.optional-dependencies]
# Heavy ML deps live here so the agent, tools, eval harness and tests can run
# without pulling torch. Install with: pip install -e ".[embeddings]"
embeddings = [
  "sentence-transformers>=3.0",
]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "ruff>=0.5",
  "anyio>=4.4",
]

[project.scripts]
assetscope-mcp = "assetscope.mcp_server:main"

[project.urls]
Homepage = "https://github.com/your-org/assetscope"
Repository = "https://github.com/your-org/assetscope"

[tool.setuptools.packages.find]
include = ["assetscope*"]

[tool.setuptools.package-data]
assetscope = ["db/*.sql", "evals/gold/*.json", "evals/fixtures/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E501: long lines are fine; UP042: `(str, Enum)` is intentional (kept for clarity
# and broad compatibility) rather than `enum.StrEnum`.
ignore = ["E501", "UP042"]
