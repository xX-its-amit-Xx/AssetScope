server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Reverse-proxy the API so the SPA can call a same-origin "/api" path.
    # This means only the frontend port needs to be exposed publicly, the API
    # is reached over the internal compose network, and there are no CORS or
    # cross-origin issues (important for Codespaces / any reverse-proxied deploy).
    #
    # Resolve the "api" service name at request time via Docker's embedded DNS
    # (127.0.0.11) + a variable upstream, so a recreated api container (new IP)
    # is picked up without restarting nginx (avoids stale-IP 502s).
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $assetscope_api "api:8000";
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$assetscope_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Server-Sent Events: disable buffering and allow long-lived streams.
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
